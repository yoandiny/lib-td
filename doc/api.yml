openapi: 3.0.3
info:
  title: Lib-TD API
  description: >
    API de gestion d'une librairie : auteurs, livres, éditions de livres,
    formats, arrivages (réassort de stock), ventes, paiements, et rapports
    (stock, chiffre d'affaires par genre).
  version: "1.0.0"

servers:
  - url: /

tags:
  - name: Authors
  - name: Books
  - name: BookEditions
  - name: Formats
  - name: Arrivals
  - name: Sales
  - name: Payments
  - name: Stock
  - name: Reports

paths:
  # ---------------------------------------------------------------------
  # AUTHORS
  # ---------------------------------------------------------------------
  /authors:
    post:
      tags: [Authors]
      summary: Créer un auteur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorRequest'
      responses:
        '201':
          description: Auteur créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
    get:
      tags: [Authors]
      summary: Lister tous les auteurs
      responses:
        '200':
          description: Liste des auteurs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'

  /authors/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      tags: [Authors]
      summary: Récupérer un auteur par id
      responses:
        '200':
          description: Auteur trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Authors]
      summary: Mettre à jour un auteur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthorRequest'
      responses:
        '200':
          description: Auteur mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Authors]
      summary: Supprimer un auteur
      responses:
        '204':
          description: Auteur supprimé

  # ---------------------------------------------------------------------
  # BOOKS
  # ---------------------------------------------------------------------
  /books:
    post:
      tags: [Books]
      summary: Créer un livre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      responses:
        '201':
          description: Livre créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
    get:
      tags: [Books]
      summary: Lister tous les livres
      responses:
        '200':
          description: Liste des livres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Book'

  /books/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      tags: [Books]
      summary: Récupérer un livre par id
      responses:
        '200':
          description: Livre trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Books]
      summary: Mettre à jour un livre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      responses:
        '200':
          description: Livre mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Books]
      summary: Supprimer un livre
      responses:
        '204':
          description: Livre supprimé

  /books/{id}/editions:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      tags: [Books]
      summary: Lister les éditions d'un livre
      responses:
        '200':
          description: Liste des éditions du livre
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookEdition'
        '404':
          $ref: '#/components/responses/NotFound'

  /books/{id}/editions/{editionId}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
      - name: editionId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Books]
      summary: Récupérer une édition précise d'un livre
      responses:
        '200':
          description: Edition trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookEdition'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------
  # BOOK EDITIONS
  # ---------------------------------------------------------------------
  /book-editions:
    post:
      tags: [BookEditions]
      summary: Créer une édition de livre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookEditionRequest'
      responses:
        '201':
          description: Edition créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookEdition'
    get:
      tags: [BookEditions]
      summary: Lister les éditions de livre (optionnellement filtrées par livre)
      parameters:
        - name: bookId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Liste des éditions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookEdition'

  /book-editions/search:
    get:
      tags: [BookEditions]
      summary: Recherche paginée d'éditions de livre selon plusieurs critères
      parameters:
        - name: isbn
          in: query
          schema:
            type: string
        - name: formatLabel
          in: query
          schema:
            $ref: '#/components/schemas/FormatLabel'
        - name: minPrice
          in: query
          schema:
            type: number
            format: double
        - name: maxPrice
          in: query
          schema:
            type: number
            format: double
        - name: title
          in: query
          schema:
            type: string
        - name: genre
          in: query
          schema:
            type: string
        - name: minYear
          in: query
          schema:
            type: integer
        - name: maxYear
          in: query
          schema:
            type: integer
        - name: authorName
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 0
        - name: size
          in: query
          schema:
            type: integer
            default: 20
        - name: sortBy
          in: query
          schema:
            type: string
            default: id
        - name: sortDir
          in: query
          schema:
            type: string
            enum: [asc, desc]
            default: asc
      responses:
        '200':
          description: Page d'éditions correspondant aux critères
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookEditionPage'

  /book-editions/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      tags: [BookEditions]
      summary: Récupérer une édition par id
      responses:
        '200':
          description: Edition trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookEdition'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [BookEditions]
      summary: Mettre à jour une édition
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookEditionRequest'
      responses:
        '200':
          description: Edition mise à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookEdition'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [BookEditions]
      summary: Supprimer une édition
      responses:
        '204':
          description: Edition supprimée

  # ---------------------------------------------------------------------
  # FORMATS
  # ---------------------------------------------------------------------
  /formats:
    post:
      tags: [Formats]
      summary: Créer un format
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormatRequest'
      responses:
        '201':
          description: Format créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Format'
    get:
      tags: [Formats]
      summary: Lister tous les formats
      responses:
        '200':
          description: Liste des formats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Format'

  /formats/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      tags: [Formats]
      summary: Récupérer un format par id
      responses:
        '200':
          description: Format trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Format'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Formats]
      summary: Mettre à jour un format
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormatRequest'
      responses:
        '200':
          description: Format mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Format'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Formats]
      summary: Supprimer un format
      responses:
        '204':
          description: Format supprimé

  # ---------------------------------------------------------------------
  # ARRIVALS
  # ---------------------------------------------------------------------
  /arrivals:
    post:
      tags: [Arrivals]
      summary: Enregistrer un arrivage (réassort) de plusieurs éditions de livre
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArrivalRequest'
      responses:
        '201':
          description: Arrivage créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Arrival'
    get:
      tags: [Arrivals]
      summary: Lister tous les arrivages
      responses:
        '200':
          description: Liste des arrivages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Arrival'

  /arrivals/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      tags: [Arrivals]
      summary: Récupérer un arrivage par id
      responses:
        '200':
          description: Arrivage trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Arrival'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Arrivals]
      summary: Supprimer un arrivage
      responses:
        '204':
          description: Arrivage supprimé

  # ---------------------------------------------------------------------
  # SALES
  # ---------------------------------------------------------------------
  /sales:
    post:
      tags: [Sales]
      summary: Créer une vente (statut initial IN_PROGRESS)
      description: >
        Le prix unitaire de chaque ligne est repris du prix courant de
        l'édition de livre. Une exception est levée si une édition n'a pas
        de prix défini.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SaleRequest'
      responses:
        '201':
          description: Vente créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '404':
          description: Client ou édition de livre introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Sales]
      summary: Lister les ventes (optionnellement filtrées par client)
      parameters:
        - name: customerId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Liste des ventes
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Sale'
        '404':
          description: Client introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sales/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      tags: [Sales]
      summary: Récupérer une vente par id
      responses:
        '200':
          description: Vente trouvée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '404':
          $ref: '#/components/responses/NotFound'

  /sales/{id}/validate:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    put:
      tags: [Sales]
      summary: Valider une vente (IN_PROGRESS -> VALIDATED)
      description: >
        Vérifie que le stock reste suffisant pour chaque édition de livre de
        la vente avant de la valider.
      responses:
        '200':
          description: Vente validée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Stock insuffisant, ou vente déjà validée/annulée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sales/{id}/cancel:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    put:
      tags: [Sales]
      summary: Annuler une vente
      responses:
        '200':
          description: Vente annulée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sale'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Vente déjà annulée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ---------------------------------------------------------------------
  # PAYMENTS
  # ---------------------------------------------------------------------
  /payments:
    post:
      tags: [Payments]
      summary: Créer un paiement pour une vente (statut initial PENDING)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '201':
          description: Paiement créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          description: Vente introuvable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Payments]
      summary: Lister tous les paiements
      responses:
        '200':
          description: Liste des paiements
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Payment'

  /payments/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      tags: [Payments]
      summary: Récupérer un paiement par id
      responses:
        '200':
          description: Paiement trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/NotFound'

  /payments/sale/{saleId}:
    parameters:
      - name: saleId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Payments]
      summary: Récupérer le paiement associé à une vente
      responses:
        '200':
          description: Paiement trouvé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/NotFound'

  /payments/{id}/process:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    put:
      tags: [Payments]
      summary: Marquer un paiement comme payé (PENDING -> PAID)
      responses:
        '200':
          description: Paiement traité
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Seuls les paiements PENDING peuvent être traités
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /payments/{id}/fail:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    put:
      tags: [Payments]
      summary: Marquer un paiement comme échoué (-> FAILED)
      responses:
        '200':
          description: Paiement marqué en échec
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------
  # STOCK
  # ---------------------------------------------------------------------
  /stock/book-edition/{id}/stock:
    parameters:
      - $ref: '#/components/parameters/IdPathParam'
    get:
      tags: [Stock]
      summary: Stock courant d'une édition de livre (BookEdition)
      description: Stock = somme des quantités arrivées - somme des quantités vendues.
      responses:
        '200':
          description: Quantité en stock
          content:
            application/json:
              schema:
                type: integer
                example: 7

  /stock/book/{bookId}:
    parameters:
      - name: bookId
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      tags: [Stock]
      summary: Stock par livre, agrégé par format d'édition
      description: >
        Retourne le stock total du livre réparti par label de format
        (ex. {"POCKET": 10, "HARDCOVER": 5}).
      responses:
        '200':
          description: Stock du livre par format
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: integer
                example:
                  POCKET: 10
                  HARDCOVER: 5
        '404':
          $ref: '#/components/responses/NotFound'

  # ---------------------------------------------------------------------
  # REPORTS
  # ---------------------------------------------------------------------
  /reports/revenue-by-genre:
    get:
      tags: [Reports]
      summary: Chiffre d'affaires (montant des ventes) regroupé par genre de livre
      responses:
        '200':
          description: Montant des ventes par genre
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: number
                  format: bigdecimal
                example:
                  "Science-Fiction": 452.50
                  "Roman": 1290.00

components:
  parameters:
    IdPathParam:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid

  responses:
    NotFound:
      description: Ressource introuvable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    ErrorResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        status:
          type: integer
        error:
          type: string
        message:
          type: string
        path:
          type: string

    # ---- Enums ----
    FormatLabel:
      type: string
      enum: [POCKET, HARDCOVER, SOFTCOVER]

    SaleStatus:
      type: string
      enum: [IN_PROGRESS, VALIDATED, CANCELLED]

    PaymentMethod:
      type: string
      enum: [CASH, CARD, MOBILE]

    PaymentStatus:
      type: string
      enum: [PENDING, PAID, FAILED]

    # ---- Entities ----
    Author:
      type: object
      properties:
        id:
          type: string
          format: uuid
        lastName:
          type: string
        firstName:
          type: string

    Book:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        author:
          $ref: '#/components/schemas/Author'
        isbn:
          type: string
        publicationYear:
          type: integer
        genre:
          type: string

    Format:
      type: object
      properties:
        id:
          type: string
          format: uuid
        formatLabel:
          $ref: '#/components/schemas/FormatLabel'

    BookEdition:
      type: object
      properties:
        id:
          type: string
          format: uuid
        isbn:
          type: string
        book:
          $ref: '#/components/schemas/Book'
        format:
          $ref: '#/components/schemas/Format'
        price:
          type: number
          format: double

    BookEditionPage:
      type: object
      description: Page Spring Data (org.springframework.data.domain.Page) d'éditions de livre.
      properties:
        content:
          type: array
          items:
            $ref: '#/components/schemas/BookEdition'
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
          description: Numéro de la page courante (0-indexé)
        size:
          type: integer
        first:
          type: boolean
        last:
          type: boolean

    ArrivalLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookEdition:
          $ref: '#/components/schemas/BookEdition'
        quantity:
          type: integer

    Arrival:
      type: object
      properties:
        id:
          type: string
          format: uuid
        arrivedAt:
          type: string
          format: date-time

    Customer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        fullName:
          type: string
        email:
          type: string
        phone:
          type: string
        registerAt:
          type: string
          format: date-time

    Sale:
      type: object
      properties:
        id:
          type: string
          format: uuid
        customer:
          $ref: '#/components/schemas/Customer'
        saleDate:
          type: string
          format: date-time
        totalAmount:
          type: number
          format: bigdecimal
        status:
          $ref: '#/components/schemas/SaleStatus'

    SaleLine:
      type: object
      properties:
        id:
          type: string
          format: uuid
        bookEdition:
          $ref: '#/components/schemas/BookEdition'
        unitPrice:
          type: number
          format: bigdecimal
        quantity:
          type: integer

    Payment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        sale:
          $ref: '#/components/schemas/Sale'
        amount:
          type: number
          format: bigdecimal
        method:
          $ref: '#/components/schemas/PaymentMethod'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        paidAt:
          type: string
          format: date-time
          nullable: true

    # ---- Request DTOs ----
    AuthorRequest:
      type: object
      properties:
        lastName:
          type: string
        firstName:
          type: string
      required: [lastName, firstName]

    BookRequest:
      type: object
      properties:
        title:
          type: string
        authorId:
          type: string
          format: uuid
        isbn:
          type: string
        publishYear:
          type: integer
        genre:
          type: string
      required: [title, authorId]

    FormatRequest:
      type: object
      properties:
        formatLabel:
          $ref: '#/components/schemas/FormatLabel'
      required: [formatLabel]

    BookEditionRequest:
      type: object
      properties:
        isbn:
          type: string
        bookId:
          type: string
          format: uuid
        formatId:
          type: string
          format: uuid
        price:
          type: number
          format: double
      required: [bookId]

    ArrivalLineRequest:
      type: object
      properties:
        bookEditionId:
          type: string
          format: uuid
        quantity:
          type: integer
      required: [bookEditionId, quantity]

    ArrivalRequest:
      type: object
      properties:
        arrivedAt:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/ArrivalLineRequest'
      required: [lines]

    SaleLineRequest:
      type: object
      properties:
        bookEditionId:
          type: string
          format: uuid
        quantity:
          type: integer
      required: [bookEditionId, quantity]

    SaleRequest:
      type: object
      properties:
        customerId:
          type: string
          format: uuid
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SaleLineRequest'
      required: [customerId, lines]

    PaymentRequest:
      type: object
      properties:
        saleId:
          type: string
          format: uuid
        method:
          $ref: '#/components/schemas/PaymentMethod'
      required: [saleId, method]